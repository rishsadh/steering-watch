# The recurring index run. Switched on 13 Oct 2026: it runs every Monday and can also be started by hand.
name: index

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # every Monday at 06:17 UTC

permissions:
  contents: write

jobs:
  run:
    if: github.repository == 'rishsadh/steering-watch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Fetch the fixed list, scan it, write the snapshot and INDEX.md
        run: node bin/steering-watch.js run
      - name: Commit the new run
        run: |
          git config user.name "steering-watch index"
          git config user.email "actions@users.noreply.github.com"
          git add data INDEX.md
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Index run $(date -u +%F)"
            git push
          fi
